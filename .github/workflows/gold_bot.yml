name: 골드 선물 봇

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy


      # =====================================================
      # DEBUG + RUN
      # =====================================================

      - name: Run Gold Signal Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          echo "===================================="
          echo " GOLD BOT GITHUB ACTION"
          echo "===================================="

          echo ""
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo ""
          echo "===== FILE LIST ====="
          ls -lah

          echo ""
          echo "===== BOT.PY INFO ====="
          ls -lh bot.py

          echo ""
          echo "===== BOT.PY VERSION CHECK ====="
          grep -n 'VERSION =' bot.py || true

          echo ""
          echo "===== MAIN CHECK ====="
          grep -n 'def main' bot.py || true

          echo ""
          echo "===== ENTRYPOINT CHECK ====="
          grep -n '__name__' bot.py || true

          echo ""
          echo "===== PYTHON VERSION ====="
          python --version

          echo ""
          echo "===== TELEGRAM CHECK ====="

          if [ -n "$TELEGRAM_TOKEN" ]; then
            echo "TELEGRAM_TOKEN: OK"
          else
            echo "TELEGRAM_TOKEN: MISSING"
          fi

          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID: OK"
          else
            echo "TELEGRAM_CHAT_ID: MISSING"
          fi

          echo ""
          echo "===================================="
          echo " STARTING BOT"
          echo "===================================="

          python -u bot.py


      # =====================================================
      # SAVE STATE
      # =====================================================

      - name: Commit state and logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update gold bot state and logs"
          file_pattern: "signal_state.json bot_log.json"
          branch: main
