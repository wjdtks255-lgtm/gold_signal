name: 골드 선물 봇

on:
  workflow_dispatch:

  schedule:
    # 5분마다 실행
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy

      - name: Run Gold Signal Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Commit state and logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update gold bot state and logs"
          file_pattern: "signal_state.json bot_log.json"
