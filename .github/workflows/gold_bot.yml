
name: Gold Smart Signal Bot V15.3.2

on:
  workflow_dispatch:
  repository_dispatch:
    types: [gold-signal]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: gold-smart-signal-v15
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run Gold V15.3.2
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python bot.py

      - name: Commit state and logs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f signal_state.json bot_log.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Gold V15.3.2 state and logs"
            git push
          else
            echo "No state/log changes."
          fi
