name: 골드 신호 텔레그램 봇

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # 매 15분마다 실행

permissions:
  contents: write # 깃허브 레포지토리에 상태 파일(signal_state.json) 변경 권한 부여

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install requests yfinance

      - name: 봇 스크립트 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: 포지션 상태 파일 변경사항 자동 동기화
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add signal_state.json || true
          git commit -m "Auto-update position lifecycle state [skip ci]" || true
          git push || true
