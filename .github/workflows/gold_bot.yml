name: 골드 선물 스마트 타점 봇

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-futures-bot
  cancel-in-progress: false

jobs:
  run-bot:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. GitHub 저장소 체크아웃
      # ==================================================

      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # 2. Python 설정
      # ==================================================

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ==================================================
      # 3. 라이브러리 설치
      # ==================================================

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas numpy


      # ==================================================
      # 4. 골드 선물 봇 실행
      # ==================================================

      - name: 골드 선물 봇 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python bot.py


      # ==================================================
      # 5. 상태 파일 / 로그 저장
      # ==================================================

      - name: 상태 및 로그 저장
        run: |

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add -A -- signal_state.json bot_log.json

          if git diff --cached --quiet; then

            echo "저장할 변경사항이 없습니다."

          else

            git commit -m "Update gold bot state [skip ci]"

            git push

          fi
