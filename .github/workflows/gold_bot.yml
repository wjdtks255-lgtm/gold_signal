name: Gold Signal Bot

on:
  schedule:
    - cron: '*/5 * * * *' # 필요에 따라 주기 조정 (예: 5분마다)
  workflow_dispatch:

# 🛑 [필수] 깃허브 저장소에 상태 파일을 커밋/푸시할 수 있는 쓰기 권한 부여
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests yfinance

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Commit and push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add signal_state.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update signal state [skip ci]" && git push)
